name: Generate Lockfile

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to generate lockfile on'
        required: true
        default: 'feature/foundation-calculators'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Sanity check
        run: |
          test -f package-lock.json || (echo "lockfile not generated" && exit 1)
          head -c 200 package-lock.json
          echo ""
          echo "integrity entries: $(grep -c '"integrity"' package-lock.json)"
          echo "resolved entries:  $(grep -c '"resolved"' package-lock.json)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No changes — lockfile already up to date."
            exit 0
          fi
          git commit -m "chore: generate package-lock.json via npm in CI"
          git push origin HEAD:${{ inputs.branch }}
